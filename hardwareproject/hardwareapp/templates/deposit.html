<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deposit Scheme</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f9;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        display: flex;
        gap: 20px;
        background: #ffffff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }

      /* FORM */
      .form-box {
        width: 40%;
        background: #ffffff;
        padding: 20px;
        border-radius: 12px;
        border-top: 5px solid #1e2a38;
        border-right: 2px solid black;
        border-bottom: 2px solid black;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }

      .form-box h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #1e2a38;
      }

      label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
        font-size: 14px;
        color: #333;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
      }

      input:focus,
      select:focus {
        border-color: #1e2a38;
        box-shadow: 0 0 0 3px rgba(30, 42, 56, 0.1);
        outline: none;
      }

      /* BUTTONS */
      button,
      .btn {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        background: linear-gradient(135deg, #1e2a38, #2f4f6f);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        display: block;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover,
      .btn:hover {
        background: #0f1720;
      }

      /* TABLE */
      .table-box {
        width: 60%;
        background: #ffffff;
        padding: 20px;
        border-radius: 17px;
        border-top: 5px solid #1e2a38;
        border-right: 2px solid black;
        border-bottom: 2px solid black;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        overflow-x: auto;
      }

      .table-box h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #1e2a38;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      th,
      td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid #eee;
        white-space: nowrap;
      }

      th {
        background: #1e2a38;
        color: white;
        font-size: 11px;
      }

      tr:hover {
        background: #f3f8ff;
      }

      /* ACTION BUTTONS */
      .actions {
        display: flex;
        gap: 6px;
        justify-content: center;
      }

      .edit-btn {
        background: #facc15;
        color: black;
        padding: 6px 10px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 11px;
        font-weight: bold;
      }

      .delete-btn {
        background: #ef4444;
        color: white;
        padding: 6px 10px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 11px;
        font-weight: bold;
      }

      .receipt-btn {
        background: #007bff;
        color: white;
        padding: 6px 10px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 11px;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }

        .form-box,
        .table-box {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    {% load static %}

    <div class="container">
      <!-- FORM -->
      <div class="form-box">
        <h2>DEPOSIT FORM</h2>

        <form method="POST">
          {% csrf_token %}

          <label>Full Name</label>
          <input type="text" name="name" required />

          <label>NIN</label>
          <input
            type="text"
            name="nin"
            maxlength="14"
            minlength="14"
            placeholder="e.g CM123456789AB"
            pattern="^(CM|CF)[A-Z0-9]{12}$"
            title="NIN must be exactly 14 characters (CM or CF + 12 characters)"
            required
          />

          <label>Phone</label>
          <input
            type="text"
            name="phone"
            placeholder="+256740230081"
            pattern="^\+256[0-9]{9}$"
            maxlength="13"
            title="Phone must be in format +256XXXXXXXXX"
            required
          />

          <label>Item Name</label>
          <select name="item_name" required>
            <option value="">Select Item</option>
            <option value="Cement">Cement</option>
            <option value="Glass">Glass</option>
            <option value="Iron Sheets">Iron Sheets</option>
            <option value="Iron Bars">Iron Bars</option>
          </select>

          <label>Date</label>
          <input type="date" name="date" required />

          <label>Payment Method</label>
          <select name="method" required>
            <option>Mobile Money</option>
            <option>Bank Transfer</option>
            <option>Cash</option>
          </select>

          <label>Amount</label>
          <input type="number" name="amount" min="1" required />

          <label>Quantity</label>
          <input type="number" name="quantity" min="1" required />

          <label>Balance</label>
          <input type="number" name="balance" min="0" />

          <button type="submit">Submit Deposit</button>
        </form>
      </div>

      <!-- TABLE -->
      <div class="table-box">
        <h2>Deposits Table</h2>

        <table>
          <tr>
            <th>Name</th>
            <th>NIN</th>
            <th>Phone</th>
            <th>Item</th>
            <th>Date</th>
            <th>Amount</th>

            <th>Quantity</th>
            <th>Balance</th>
            <th>Actions</th>
          </tr>

          {% for d in deposits %}
          <tr>
            <td>{{ d.name }}</td>
            <td>{{ d.nin }}</td>
            <td>{{ d.phone }}</td>
            <td>{{ d.item_name }}</td>
            <td>{{ d.date }}</td>
            <td>{{ d.amount }}</td>
            <td>{{ d.quantity }}</td>
            <td>{{ d.balance }}</td>

            <td class="actions">
              <a href="{% url 'deposit_receipt' d.id %}" class="receipt-btn"
                >Receipt</a
              >
              <a href="{% url 'edit_deposit' d.id %}" class="edit-btn">Edit</a>
              <a href="{% url 'delete_deposit' d.id %}" class="delete-btn"
                >Delete</a
              >
            </td>
          </tr>
          {% endfor %}
        </table>
      </div>
    </div>
  </body>
</html>
