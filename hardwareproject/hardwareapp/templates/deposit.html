<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deposit Scheme</title>

    <style>
      * {
        margin: 0; /* Remove default margin */
        padding: 0; /* Remove default padding */
        box-sizing: border-box; /* Make the padding inside the box include the padding and border */
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #eef3f8, #dfe9f3);
        display: flex; /* Display the content in the center */
        justify-content: center; /* Center the content horizontally */
        align-items: center;
        min-height: 100vh; /* Make the body take up the entire viewport */
        padding: 20px;
      }

      /* CARD */
      .container {
        width: 100%;
        max-width: 520px;
        background: #ffffff;
        padding: 30px;
        border-radius: 16px; /* Add a border radius to the card */
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* Add a shadow effect to the card */
        border-top: 5px solid #1e2a38; /* Add a border to the top of the card */
      }

      /* LOGO */
      .logo {
        text-align: center;
        margin-bottom: 15px;
      }

      .logo img {
        width: 120px;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #1e2a38;
        font-size: 22px;
      }

      label {
        display: block;
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
        color: #333;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        outline: none; /* Remove the default outline */
        transition: 0.2s; /* Add a transition effect to the input */
        font-size: 14px;
      }

      input:focus,
      select:focus {
        border-color: #1e2a38;
        box-shadow: 0 0 0 3px rgba(30, 42, 56, 0.1);
      }

      button,
      .btn {
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        background: linear-gradient(135deg, #1e2a38, #2f4f6f);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
        text-align: center;
        display: block;
        text-decoration: none;
      }

      button:hover,
      .btn:hover {
        background: #0f1720;
      }

      .rec {
        text-align: center;
        margin-top: 15px;
        font-size: 13px;
        color: #555;
      }
      /*mobile view*/
      @media (max-width: 600px) {
        .container {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      {% load static %}

      <div class="logo">
        <img src="{% static 'images/logo22.png' %}" alt="Logo" />
      </div>

      <h2>Deposit Scheme</h2>

      <!-- FORM -->
      <form method="POST">
        {% csrf_token %}

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required />

        <label>Phone</label>
        <input type="text" name="phone" placeholder="+256..." required />

        <label>Amount</label>
        <input
          type="number"
          name="amount"
          placeholder="Enter amount"
          required
        />

        <label>Method</label>
        <select name="method" required>
          <option value="">Select method</option>
          <option>Mobile Money</option>
          <option>Bank Transfer</option>
          <option>Cash</option>
        </select>

        <label>Purpose</label>
        <input type="text" name="purpose" placeholder="e.g Cement purchase" />

        <button type="submit">Submit Deposit</button>

        <a href="{% url 'stock' %}" class="btn">Go to Stock System</a>

        <p class="rec">
          Secure deposit system • All transactions are recorded safely
        </p>
      </form>
    </div>
  </body>
</html>
