<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Customer</title>

    <style>
      body {
        font-family: Arial;
        background: #f4f6f9;
        padding: 20px;
      }

      .box {
        width: 400px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        border-top: 5px solid #1e2a38;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        color: #1e2a38;
      }

      label {
        display: block;
        width: 80%;
        margin: 12px auto 5px auto;
        font-weight: bold;
      }

      input {
        width: 80%;
        padding: 10px;
        margin: 5px auto;
        display: block;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      button {
        width: 80%;
        margin: 20px auto;
        display: block;
        padding: 12px;
        background: linear-gradient(135deg, #1e2a38, #2f4f6f);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }

      button:hover {
        background: #0f1720;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h2>Edit Customer</h2>

      <form method="POST">
        {% csrf_token %}

        <label>Name</label>
        <input type="text" name="name" value="{{ customer.name }}" />

        <label>Phone</label>
        <input type="text" name="phone" value="{{ customer.phone }}" />

        <label>Email</label>
        <input type="email" name="email" value="{{ customer.email }}" />

        <label>Address</label>
        <input type="text" name="address" value="{{ customer.address }}" />

        <button type="submit">Update Customer</button>
      </form>
    </div>
  </body>
</html>
