<!doctype html>
<html>
  <head>
    <title>Edit Deposit</title>
    <style>
      body {
        font-family: Arial;
        background: #eef3f8;
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      .box {
        width: 450px;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 6px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #1e2a38;
        color: white;
        border: none;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h2>Edit Deposit</h2>

      <form method="POST">
        {% csrf_token %}
        <label>Name</label>
        <input name="name" value="{{ deposit.name }}" />

        <label>Phone</label>
        <input name="phone" value="{{ deposit.phone }}" />

        <label>Amount</label>
        <input name="amount" value="{{ deposit.amount }}" />

        <label>Item Name</label>
        <input name="item_name" value="{{ deposit.item_name }}" />

        <label>NIN</label>
        <input name="nin" value="{{ deposit.nin }}" />

        <label>Method</label>
        <input name="method" value="{{ deposit.method }}" />

        <label>Quantity</label>
        <input name="quantity" value="{{ deposit.quantity }}" />

        <label>Balance</label>
        <input name="balance" value="{{ deposit.balance }}" />  

        <label>Date</label>
        <input type="date" name="date" value="{{ deposit.date|date:'Y-m-d' }}">

        <button type="submit">Update</button>
      </form>
    </div>
  </body>
</html>
