<!doctype html>
<html>
  <head>
    <title>Edit Deposit</title>
    <style>
      body {
        font-family: Arial;
        background: #eef3f8;
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      .box {
        width: 450px;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      label {
        display: block;
        width: 80%;
        margin: 10px auto 5px auto;
      }

      input {
        width: 80%;
        padding: 10px;
        margin: 6px auto;
        display: block;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      button {
        width: 80%;
        padding: 12px;
        margin: 15px auto;
        display: block;
        background: #1e2a38;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background: #2c3e50;
      }

      /* optional: show balance nicely */
      .readonly {
        background: #f1f1f1;
        color: #333;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h2 style="text-align: center">Edit Deposit</h2>

      <form method="POST">
        {% csrf_token %}

        <label>Name</label>
        <input name="name" value="{{ deposit.name }}" />

        <label>Phone</label>
        <input name="phone" value="{{ deposit.phone }}" />

        <label>Amount</label>
        <input name="amount" value="{{ deposit.amount }}" />

        <label>Item Name</label>
        <input name="item_name" value="{{ deposit.item_name }}" />

        <label>NIN</label>
        <input name="nin" value="{{ deposit.nin }}" />

        <label>Method</label>
        <input name="method" value="{{ deposit.method }}" />

        <label>Quantity</label>
        <input name="quantity" value="{{ deposit.quantity }}" />

        <label>Balance</label>
        <input value="{{ deposit.balance }}" class="readonly" readonly />

        <label>Date</label>
        <input type="date" name="date" value="{{ deposit.date|date:'Y-m-d' }}" />

        <button type="submit">Update</button>
      </form>
    </div>
  </body>
</html>
