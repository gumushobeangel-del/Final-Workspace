<!doctype html>
<html>
  <head>
    <title>Edit Sales</title>
    <style>
      body {
        font-family: Arial;
        background: #eef3f8;
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      .box {
        width: 450px;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      /* ✅ Labels */
      label {
        display: block;
        width: 80%;
        margin: 10px auto 5px auto;
      }

      /* ✅ Inputs now 80% and centered */
      input {
        width: 80%;
        padding: 10px;
        margin: 6px auto;
        display: block;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      /* ✅ Button also matches */
      button {
        width: 80%;
        padding: 12px;
        margin: 15px auto;
        display: block;
        background: #1e2a38;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background: #2c3e50;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h2 style="text-align: center">Edit Sale</h2>

      <form method="POST">
        {% csrf_token %}

        <label>Item Name</label>
        <input name="item_name" value="{{ sale.item_name }}" />

        <label>Quantity</label>
        <input name="quantity" value="{{ sale.quantity }}" />

        <label>Unit Price</label>
        <input name="unit_price" value="{{ sale.unit_price }}" />

        <label>Distance (km)</label>
        <input name="distance_km" value="{{ sale.distance_km }}" />

        <label>Transport</label>
        <input name="transport" value="{{ sale.transport }}" />

        <label>Customer Name</label>
        <input name="customer_name" value="{{ sale.customer_name }}" />

        <label>Customer Contact</label>
        <input name="customer_contact" value="{{ sale.customer_contact }}" />

        <label>Item Type</label>
        <input name="item_type" value="{{ sale.item_type }}" />

        <label>Item Brand</label>
        <input name="item_brand" value="{{ sale.item_brand }}" />

        <label>Date</label>
        <input type="date" name="date" value="{{ sale.date|date:'Y-m-d' }}" />

        <button type="submit">Update</button>
      </form>
    </div>
  </body>
</html>
