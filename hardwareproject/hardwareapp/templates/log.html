{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #eef3f8, #dfe9f3);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* LOGIN CARD */
      .container {
        width: 100%;
        max-width: 350px;
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border-top: 5px solid #1e2a38;
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #1e2a38;
        font-size: 22px;
      }

      label {
        display: block;
        margin-top: 12px;
        font-size: 14px;
        font-weight: 600;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        outline: none;
        font-size: 14px;
      }

      input:focus {
        border-color: #1e2a38;
        box-shadow: 0 0 0 3px rgba(30, 42, 56, 0.1);
      }

      button {
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        background: linear-gradient(135deg, #1e2a38, #2f4f6f);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
      }

      button:hover {
        background: #0f1720;
      }

      /*  ERROR ALERT */
      .alert {
        background: #ffdddd;
        color: #a94442;
        padding: 10px;
        border-left: 5px solid red;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 14px;
        animation: fadeIn 0.4s ease-in-out;
      }

      .error-box {
        background: #ffebee;
        color: red;
        border: 1px solid red;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-weight: bold;
      }

      input:invalid {
        border: 2px solid red;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      p {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        color: #555;
      }

      .error-input{
    border: 2px solid red;
    outline: none;
}

.error-text{
    color: red;
    font-size: 13px;
    margin-top: 5px;
    display: block;
}

      a {
        color: #1e2a38;
        font-weight: bold;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Welcome to Nyondo Hardware!</h1>

      {% if messages %} {% for message in messages %}
      <div class="error-box">{{ message }}</div>
      {% endfor %} {% endif %}
      <form method="POST">
    {% csrf_token %}

    <div class="input-box">
        <input type="text" name="username" placeholder="Username"
        class="{% if error_username %}error-input{% endif %}">
        
        {% if error_username %}
            <small class="error-text">Fill in the username</small>
        {% endif %}
    </div>

    <div class="input-box">
        <input type="password" name="password" placeholder="Password"
        class="{% if error_password %}error-input{% endif %}">
        
        {% if error_password %}
            <small class="error-text">Fill in the password</small>
        {% endif %}
    </div>

    <button type="submit">Login</button>
</form>
    </div>
  </body>
</html>
