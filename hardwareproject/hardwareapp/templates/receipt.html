<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nyondo Hardware - Receipt</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #eef3f8, #dfe9f3);
    padding: 20px;
  }

  .receipt {
    width: 420px;
    margin: auto;
    background: white;
    padding: 25px;
    border: 2px solid #1e2a38;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  }

  /* HEADER */
  .header {
    text-align: center;
    border-bottom: 2px solid #1e2a38;
    padding-bottom: 10px;
  }

  .header h1 {
    margin: 0;
    font-size: 18px;
    color: #1e2a38;
  }

  .header p {
    margin: 3px;
    font-size: 13px;
    color: #555;
  }

  .badge {
    background: #1e2a38;
    color: white;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
  }

  /* INFO SECTION */
  .info {
    margin-top: 15px;
    font-size: 14px;
  }

  .info input {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    border: 1px solid #d1d5db;
    border-radius: 8px;
  }

  .info input:focus {
    border-color: #1e2a38;
    outline: none;
  }

  /* TABLE */
  table {
    width: 100%;
    margin-top: 15px;
    border-collapse: collapse;
  }

  th {
    background: #1e2a38;
    color: white;
    padding: 10px;
    font-size: 12px;
  }

  td {
    border-bottom: 1px solid #e5e7eb;
    padding: 8px;
    font-size: 14px;
  }

  input.table-input {
    width: 100%;
    border: none;
    outline: none;
  }

  /* TOTAL */
  .total {
    text-align: right;
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    color: #1e2a38;
  }

  .total input {
    width: 120px;
    padding: 6px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
  }

  /* BUTTON */
  button {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    background: linear-gradient(135deg, #1e2a38, #2f4f6f);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  button:hover {
    background: #0f1720;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #6b7280;
  }
</style>
</head>

<body>

<form class="receipt">

  <div class="header">
    <h1>NYONDO HARDWARE STOCK SYSTEM</h1>
    <p>Inventory & Sales Receipt</p>
    <span class="badge">OFFICIAL RECEIPT</span>
  </div>

  <div class="info">
    <label>Receipt No:</label>
    <input type="text" name="receipt_no">

    <label>Date:</label>
    <input type="date" name="date">

    <label>Cashier:</label>
    <input type="text" name="cashier">

    <label>Customer:</label>
    <input type="text" name="customer">
  </div>

  <table>
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Price (UGX)</th>
    </tr>

    <tr>
      <td><input class="table-input" name="item1"></td>
      <td><input class="table-input" name="qty1" type="number"></td>
      <td><input class="table-input" name="price1" type="number"></td>
    </tr>

    <tr>
      <td><input class="table-input" name="item2"></td>
      <td><input class="table-input" name="qty2" type="number"></td>
      <td><input class="table-input" name="price2" type="number"></td>
    </tr>

    <tr>
      <td><input class="table-input" name="item3"></td>
      <td><input class="table-input" name="qty3" type="number"></td>
      <td><input class="table-input" name="price3" type="number"></td>
    </tr>
  </table>

  <div class="total">
    TOTAL: <input type="number" name="total">
  </div>

  <button type="submit">Generate Receipt</button>

  <div class="footer">
    Thank you for shopping at Nyondo Hardware<br>
    System generated receipt
  </div>

</form>

</body>
</html>
