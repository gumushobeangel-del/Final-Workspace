<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Registration</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f6f9;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        display: flex;
        gap: 20px;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }

      .form-section,
      .table-section {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        border-top: 5px solid #1e2a38;
        border-right: 2px solid black;
        border-bottom: 2px solid black;
      }

      .form-section {
        width: 40%;
      }
      .table-section {
        width: 60%;
        overflow-x: auto;
      }

      h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #1e2a38;
      }

      label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      input:focus {
        border-color: #1e2a38;
        outline: none;
      }

      button {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        background: linear-gradient(135deg, #1e2a38, #2f4f6f);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #0f1720;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      th,
      td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid #eee;
      }

      th {
        background: #1e2a38;
        color: white;
      }

      tr:hover {
        background: #f3f8ff;
      }

      /* EDIT BUTTON */
      .edit-btn {
        background: #facc15;
        color: black;
        padding: 5px 8px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 11px;
        font-weight: bold;
        margin-right: 5px;
      }

      .edit-btn:hover {
        background: #eab308;
      }

      /* DELETE BUTTON */
      .delete-btn {
        background: #ef4444;
        color: white;
        padding: 5px 8px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 11px;
        font-weight: bold;
      }

      .delete-btn:hover {
        background: #dc2626;
      }

      @media (max-width: 900px) {
        .container {
          flex-direction: column;
        }

        .form-section,
        .table-section {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- FORM -->
      <div class="form-section">
        <h2>Customer Form</h2>

        <form method="POST">
          {% csrf_token %}

          <label>Full Name</label>
          <input type="text" name="name" required />

          <label for="phone">Phone Number</label>
          <input
            type="text"
            name="phone"
            placeholder="+256740230081"
            pattern="^\+256[0-9]{9}$"
            maxlength="13"
            title="Phone must be in format +256XXXXXXXXX"
            required
          />

          <label>Email</label>
          <input type="email" name="email" />

          <label>Address</label>
          <input type="text" name="address" />

          <button type="submit">Register Customer</button>
        </form>
      </div>

      <div class="table-section">
        <h2>Customer Table</h2>

        <table>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Action</th>
          </tr>

          {% for customer in customers %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ customer.name }}</td>
            <td>{{ customer.phone }}</td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.address }}</td>
            <td>
              <a href="{% url 'edit_customer' customer.id %}" class="edit-btn"
                >Edit</a
              >
              <a
                href="{% url 'delete_customer' customer.id %}"
                class="delete-btn"
                onclick="
                  return confirm(
                    'Are you sure you want to delete this customer?',
                  );
                "
              >
                Delete
              </a>
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="6">No customers yet</td>
          </tr>
          {% endfor %}
        </table>
      </div>
    </div>
  </body>
</html>
