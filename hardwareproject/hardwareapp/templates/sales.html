<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Form</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #eef3f8, #dfe9f3);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        display: flex;
        gap: 20px;
        background: #fff;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .form-box {
        width: 40%;
        background: #ffffff;
        padding: 20px;
        border-radius: 12px;
        border-top: 5px solid #1e2a38; /* Add a border to the top of the card */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* Add a shadow effect to the card */
      }

      .form-box h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #1e2a38;
      }

      label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
        font-size: 14px;
        color: #333;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
      }

      input:focus {
        border-color: #1e2a38;
        box-shadow: 0 0 0 3px rgba(30, 42, 56, 0.1);
      }

      button,
      .btn {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        background: linear-gradient(135deg, #1e2a38, #2f4f6f);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        display: block;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover,
      .btn:hover {
        background: #0f1720;
      }

      .table-box {
        width: 60%;
        background: #ffffff;
        padding: 20px;
        border-radius: 12px;
        border-top: 5px solid #1e2a38;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }

      .table-box h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #1e2a38;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 10px;
        overflow: hidden;
      }

      table th {
        background: #1e2a38;
        color: white;
        padding: 12px;
        font-size: 13px;
      }

      table td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
      }

      tr:hover {
        background: #f3f8ff;
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }

        .form-box,
        .table-box {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="main">
      <div class="container">
        <div class="form-box">
          <h2>REGISTER SALE</h2>

          <form method="POST">
            {% csrf_token %}

            <label>Product Name</label>
            <input type="text" name="product_name" required />

            <label>Quantity</label>
            <input type="number" name="quantity" required />

            <label>Date</label>
            <input type="date" name="date" required />

            <label>Unit Price</label>
            <input type="number" name="unit_price" required />

            <label>Customer Name</label>
            <input type="text" name="customer_name" required />

            <label>Customer Contact</label>
            <input type="tel" name="customer_contact" required />

            <label>Item Type</label>
            <input type="text" name="item_type" required />

            <label>Item Brand</label>
            <input type="text" name="item_brand" required />

            <button type="submit">Add Sale</button>

            <a href="{% url 'deposit' %}" class="btn">
              Register Customer Deposit
            </a>
          </form>
        </div>

        <div class="table-box">
          <h2>Sales Inventory</h2>

          <table>
            <tr>
              <th>Product</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Total</th>
            </tr>

            <tr>
              <td>Cement</td>
              <td>10</td>
              <td>35,000</td>
              <td>350,000</td>
            </tr>

            <tr>
              <td>Nails</td>
              <td>5</td>
              <td>5,000</td>
              <td>25,000</td>
            </tr>

            <tr>
              <td>Pipes</td>
              <td>30</td>
              <td>6,000</td>
              <td>180,000</td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
